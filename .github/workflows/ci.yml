name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format check
        run: |
          files=$(gofmt -l memory64.go memory64_test.go wasm.go)
          if [ -n "$files" ]; then echo "$files"; exit 1; fi
      - name: Vet
        run: go vet ./...
      # compile/ integration tests require external ESBUILD_WASM and TSGO_WASM
      # binaries. They intentionally fail rather than falsely skip when absent;
      # only the self-contained wasm core is covered by this PR workflow.
      - name: Test sandbox core with race detector
        run: go test -race -count=1 .
